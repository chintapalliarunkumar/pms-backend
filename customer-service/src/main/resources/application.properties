server.port=8081
server.servlet.context-path=/

spring.application.name=customer-service
spring.datasource.url=jdbc:mysql://localhost:3306/policy_customer_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Anees@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

jwt.secret=ChangeThisToASecureRandomlyGenerated256BitSecretKeyForJwtSigning
jwt.expiration-ms=3600000

app.security.enabled=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

management.endpoints.web.exposure.include=health,info

logging.level.root=INFO
logging.level.com.cognizant.customerservice=DEBUG

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
