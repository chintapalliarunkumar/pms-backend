server.port=8092

spring.application.name=api-gateway

# Eureka service discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Routes are resolved through Eureka using lb://SERVICE-NAME.
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1.0/auth/**

spring.cloud.gateway.routes[1].id=customer-service
spring.cloud.gateway.routes[1].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1.0/customer/**

spring.cloud.gateway.routes[2].id=policy-service
spring.cloud.gateway.routes[2].uri=lb://POLICY-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1.0/policy/**

# Swagger/OpenAPI document routes used by the gateway Swagger UI.
# These routes are intentionally limited to the OpenAPI JSON endpoints.
spring.cloud.gateway.routes[3].id=auth-service-openapi
spring.cloud.gateway.routes[3].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/auth-service/api-docs
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/auth-service/api-docs,/api-docs

spring.cloud.gateway.routes[4].id=customer-service-openapi
spring.cloud.gateway.routes[4].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/customer-service/api-docs
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/customer-service/api-docs,/api-docs

spring.cloud.gateway.routes[5].id=policy-service-openapi
spring.cloud.gateway.routes[5].uri=lb://POLICY-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/policy-service/api-docs
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/policy-service/api-docs,/api-docs

# Do not expose /service/** verification endpoints through the public gateway.
# Auth Service calls those endpoints directly through Eureka/OpenFeign.

management.endpoints.web.exposure.include=health,info,gateway

logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=INFO
logging.level.com.cognizant.apigateway=DEBUG

# SpringDoc / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/auth-service/api-docs

springdoc.swagger-ui.urls[1].name=Customer Service
springdoc.swagger-ui.urls[1].url=/customer-service/api-docs

springdoc.swagger-ui.urls[2].name=Policy Service
springdoc.swagger-ui.urls[2].url=/policy-service/api-docs

springdoc.swagger-ui.urlsPrimaryName=Auth Service
