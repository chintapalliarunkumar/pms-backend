server.port=8085
server.servlet.context-path=/

spring.application.name=policy-service

# Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/policy_service_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Anees@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Jackson
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

# JWT configuration - MUST match the signing secret used by Auth Service.
# Policy Service only validates tokens issued by Auth Service; it does not issue them.
jwt.secret=ChangeThisToASecureRandomlyGenerated256BitSecretKeyForJwtSigning
jwt.expiration-ms=3600000

# Admin credential pair used only by the service-to-service credential verification endpoint.
# AdminController - no entity, repository, service, or database row
# involved. There is no admin self-registration endpoint.
# CHANGE THIS PASSWORD before any real deployment.
admin.default.username=admin
admin.default.password=admin

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Actuator
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.root=INFO
logging.level.com.policyservice=DEBUG

# Eureka service discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
